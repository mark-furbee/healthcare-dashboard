server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API calls: no CORS configuration and no API URL baked into the build.
  location /api/ {
    proxy_pass http://backend:8000/;
  }

  # Client-side routing: unknown paths load the app, which renders its own 404 page.
  location / {
    try_files $uri /index.html;
  }
}
